<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}html{color-scheme:light}body{margin:0}img{max-width:100%}</style>
<title>Homebrewery Workshop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Typ-Auswahl als Kartenraster, danach ein Formular-Editor mit mitlaufender Homebrewery-Code-Ausgabe. */
:root {
  --bg: #F3F1EC;
  --surface: #FFFFFF;
  --field: #FFFFFF;
  --field-off: #F1F2F4;
  --tb: #EEF0F2;
  --fg: #181D23;
  --muted: #5A6470;
  --line: #D6D9DE;
  --field-line: #C5D0E4;
  --bar: #1F272D;
  --bar-fg: #E9EDF0;
  --btn: #3FC4F4;
  --btn-fg: #06151D;
  --btn-dis: #CDEFFB;
  --btn-dis-fg: #82AFC0;
  --danger: #B3261E;
  --ok: #1B7A4B;
  --code-bg: #151A20;
  --code-fg: #E3E7EE;
  --code-muted: #8B95A5;
  --f-body: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-cond: 'Roboto Condensed', 'Arial Narrow', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161B; --surface: #1B2128; --field: #11161C; --field-off: #171D24; --tb: #232B34;
    --fg: #E6E9ED; --muted: #98A2AE; --line: #2B333D; --field-line: #38445C;
    --bar: #0C1014; --bar-fg: #E9EDF0; --btn-dis: #1B3440; --btn-dis-fg: #5E8797;
    --danger: #F2867F; --ok: #5ED39A; --code-bg: #0B0E12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161B; --surface: #1B2128; --field: #11161C; --field-off: #171D24; --tb: #232B34;
  --fg: #E6E9ED; --muted: #98A2AE; --line: #2B333D; --field-line: #38445C;
  --bar: #0C1014; --bar-fg: #E9EDF0; --btn-dis: #1B3440; --btn-dis-fg: #5E8797;
  --danger: #F2867F; --ok: #5ED39A; --code-bg: #0B0E12;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--f-body); }
.in {
  max-width: 1280px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.main { padding-block: 22px 28px; }
.about { padding-block: 0 36px; font-size: 12px; line-height: 1.5; color: var(--muted); max-width: 90ch; }
h1, h2, h3 { margin: 0; font-family: var(--f-cond); text-wrap: balance; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--btn); outline-offset: 2px; }

/* Kopfleiste */
.bar { background: var(--bar); color: var(--bar-fg); }
.barin { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 24px; padding-block: 12px; }
.brand { font: 700 20px/1 var(--f-cond); letter-spacing: .06em; text-transform: uppercase; text-decoration: none; }
.nav { display: flex; flex-wrap: wrap; gap: 4px 22px; }
.nav a { font: 700 13px/1 var(--f-cond); letter-spacing: .06em; text-transform: uppercase; text-decoration: none; padding: 8px 0; border-bottom: 2px solid transparent; color: var(--bar-fg); opacity: .82; }
.nav a:hover { opacity: 1; }
.nav a.on { opacity: 1; border-bottom-color: var(--btn); }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; text-align: center; gap: 6px;
  font: 700 12px/1.15 var(--f-cond); letter-spacing: .05em; text-transform: uppercase; text-decoration: none;
  padding: 13px 16px; border: 0; border-radius: 2px; cursor: pointer;
  background: var(--btn); color: var(--btn-fg);
}
.btn:hover { filter: brightness(1.07); }
.btn:disabled { background: var(--btn-dis); color: var(--btn-dis-fg); cursor: not-allowed; filter: none; }
.btn.dark { background: #000; color: #fff; box-shadow: inset 0 0 0 2px var(--btn); }
.btn.line { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1px var(--field-line); }
.btn.sm { padding: 9px 12px; }
.btn.armed { background: var(--danger); color: #fff; box-shadow: none; }

/* Startseite */
.lead { margin: 0 0 18px; color: var(--muted); max-width: 70ch; }
.cards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.card {
  --acc: #555;
  position: relative; min-width: 0; min-height: 270px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  padding: 30px 22px; text-align: center; color: #fff; border-radius: 3px; overflow: hidden;
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.035) 0 2px, transparent 2px 12px),
    linear-gradient(135deg, color-mix(in srgb, var(--acc) 46%, #10151A), #10151A 72%);
}
.card h2 { font: 400 2.1rem/1.1 var(--f-body); }
.card p { margin: 0; max-width: 46ch; min-height: 3em; font-weight: 500; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
.cbtns { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin-top: 6px; }
@media (min-width: 740px) {
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .card:last-child:nth-child(odd) { grid-column: 1 / -1; justify-self: center; width: calc(50% - 10px); }
}

/* Unterseiten */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; background: var(--surface); border: 1px solid var(--line); padding: 8px 12px; border-radius: 3px; font: 700 11px/1 var(--f-cond); text-transform: uppercase; letter-spacing: .03em; }
.crumbs a, .crumbs span { text-decoration: none; }
.crumbs > * + *::before { content: ""; display: inline-block; width: 5px; height: 5px; margin: 0 10px 1px; border-right: 1.5px solid var(--muted); border-top: 1.5px solid var(--muted); transform: rotate(45deg); }
.crumbs .cur { color: var(--muted); }
.topbtns { display: flex; flex-wrap: wrap; gap: 8px; }
.ptitle { font: 700 2.1rem/1.1 var(--f-cond); padding-bottom: 12px; border-bottom: 3px solid var(--acc, var(--btn)); margin-bottom: 22px; }

.picker { max-width: 600px; margin: 40px auto 0; background: var(--surface); border: 1px solid var(--line); padding: 28px 40px 36px; text-align: center; box-shadow: 0 4px 18px rgba(0,0,0,.14); }
.picker h1 { font-size: 2.1rem; font-weight: 700; margin-bottom: 26px; }
.picker label { display: block; font: 500 1.05rem var(--f-body); margin-bottom: 10px; }
.picker .btn { width: 60%; min-width: 220px; padding: 17px; margin: 24px 0; }
.or { display: flex; align-items: center; gap: 16px; font: 700 14px var(--f-cond); color: var(--fg); }
.or::before, .or::after { content: ""; flex: 1; border-top: 1px solid var(--btn); }

/* Editor */
.editor { display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1120px) {
  .editor { grid-template-columns: minmax(0, 1fr) 440px; align-items: start; }
  .out-panel { position: sticky; top: 16px; max-height: calc(100vh - 32px); }
}
.form { container-type: inline-size; min-width: 0; }
.fgrid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 20px 16px; }
.sec { grid-column: 1 / -1; }
.sec h2 { font: 700 1.15rem/1.2 var(--f-cond); text-transform: uppercase; letter-spacing: .01em; }
.sec-help { margin: 4px 0 0; color: var(--muted); }
.fld { grid-column: 1 / -1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
@container (min-width: 620px) { .fld { grid-column: span var(--cols, 12); } }
.lh { display: flex; align-items: center; gap: 6px; min-height: 18px; }
.lab { font: 700 12px/1.2 var(--f-cond); text-transform: uppercase; letter-spacing: .02em; }
.lab.ghost { visibility: hidden; }
.req { color: var(--danger); }
.q { width: 16px; height: 16px; padding: 0; border-radius: 50%; border: 0; background: var(--fg); color: var(--bg); font: 700 11px/16px var(--f-body); cursor: pointer; flex: 0 0 auto; }
.help { margin: 0; font-size: 13px; color: var(--muted); }
.hint { margin: 0; font-size: 12px; color: var(--muted); }
input[type=text], input[type=number], select, textarea {
  width: 100%; font: 15px/1.4 var(--f-body); color: var(--fg); background: var(--field);
  border: 1px solid var(--field-line); border-radius: 2px; padding: 12px;
}
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .7; }
select { padding-right: 8px; }
.fld.off { opacity: .55; }
.fld.off input, .fld.off select, .fld.off textarea { background: var(--field-off); }
.fld.off .btn, .fld.off .tg, .fld.off .chip { cursor: not-allowed; }
.modv { font: 500 13px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }

.chk { display: flex; align-items: center; gap: 10px; font: 700 12px/1.2 var(--f-cond); text-transform: uppercase; cursor: pointer; padding-top: 22px; }
.chk input { width: 20px; height: 20px; margin: 0; accent-color: var(--btn); }
.tgs { display: flex; flex-wrap: wrap; gap: 6px; }
.tg { width: 48px; height: 48px; font: 700 15px var(--f-body); color: var(--fg); background: var(--field); border: 1px solid var(--field-line); border-radius: 2px; cursor: pointer; }
.tg[aria-pressed="true"] { background: var(--btn); color: var(--btn-fg); border-color: var(--btn); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 700 12px/1 var(--f-cond); text-transform: uppercase; letter-spacing: .03em; padding: 10px 12px; color: var(--fg); background: var(--field); border: 1px solid var(--field-line); border-radius: 2px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--btn); color: var(--btn-fg); border-color: var(--btn); }

/* Rich-Text-Leiste */
.rte { border: 1px solid var(--field-line); background: var(--field); }
.arow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.arow select { flex: 1 1 140px; min-width: 0; }
.athumb { width: 44px; height: 44px; object-fit: cover; border: 1px solid var(--field-line); }
.bgp { padding: 10px 14px; background: rgba(255,255,255,.04); border-bottom: 1px solid rgba(255,255,255,.1); }
.bgc { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
.bgl { display: flex; flex-direction: column; gap: 4px; font: 700 11px var(--f-cond); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.bgp .bgl { color: var(--code-muted); }
.bgl select { min-width: 140px; }
.bgl input[type=color] { width: 56px; height: 36px; padding: 2px; border: 1px solid var(--field-line); background: var(--field); cursor: pointer; }
.imgp { border-bottom: 1px solid var(--field-line); padding: 8px; background: var(--field); }
.aph { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.apm { font-size: 13px; color: var(--muted); }
.out-panel .apm { color: var(--code-muted); }
.apg { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; max-height: 220px; overflow: auto; }
.apt { display: flex; flex-direction: column; gap: 4px; min-width: 0; padding: 4px; border: 1px solid var(--field-line); background: var(--surface); color: var(--fg); cursor: pointer; font: 500 11px var(--f-body); }
.apt img { width: 100%; aspect-ratio: 1; object-fit: cover; }
.apt span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.adrop { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 22px; border: 2px dashed var(--field-line); background: var(--surface); margin-bottom: 20px; }
.adrop.over { border-color: var(--btn); }
.agrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.atile { min-width: 0; display: flex; flex-direction: column; border: 1px solid var(--line); background: var(--surface); }
.atile img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #8a8a8a; }
.atile .am { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; min-width: 0; }
.atile .an { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.atile .ab { display: flex; flex-wrap: wrap; gap: 6px; }
.asub { margin: 24px 0 10px; font: 700 1.15rem var(--f-cond); text-transform: uppercase; letter-spacing: .03em; }
.hintimg { margin-top: 8px; color: #F2C46B; }
.tb { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; padding: 4px 6px; background: var(--tb); border-bottom: 1px solid var(--field-line); }
.tb button, .tb select { height: 28px; min-width: 30px; padding: 0 8px; font: 500 13px var(--f-body); color: var(--fg); background: transparent; border: 1px solid transparent; border-radius: 2px; cursor: pointer; }
.tb select { width: auto; border-color: var(--field-line); padding: 0 4px; font-size: 13px; background: var(--field); }
.tb button:hover { background: var(--field); border-color: var(--field-line); }
.tb .sep { width: 1px; height: 18px; background: var(--field-line); margin: 0 4px; }
.rte textarea { display: block; border: 0; border-radius: 0; min-height: 120px; resize: vertical; font: 13.5px/1.6 var(--f-mono); }
.fld.off .tb button, .fld.off .tb select { pointer-events: none; }

/* Wiederholbare Einträge */
.rep { display: flex; flex-direction: column; gap: 12px; }
.ritem { background: var(--surface); border: 1px solid var(--line); padding: 14px; }
.rhead { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; }
.rhead strong { flex: 1; font: 700 13px var(--f-cond); text-transform: uppercase; letter-spacing: .03em; }
.iact { min-width: 32px; height: 32px; padding: 0 8px; background: transparent; border: 1px solid var(--field-line); color: var(--fg); font: 500 14px var(--f-body); cursor: pointer; border-radius: 2px; }
.iact:hover { background: var(--field-off); }
.iact.armed { background: var(--danger); border-color: var(--danger); color: #fff; font-size: 12px; }
.repadd { align-self: flex-start; }

.edfoot { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; border-top: 1px solid var(--line); padding-top: 18px; }
.status { font-size: 13px; color: var(--muted); flex: 1; min-width: 200px; }
.status.ok { color: var(--ok); }

/* Ausgabe */
.out-panel { display: flex; flex-direction: column; min-height: 0; background: var(--code-bg); color: var(--code-fg); border-radius: 3px; overflow: hidden; }
.out-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,.1); }
.out-head h2 { font: 700 15px var(--f-cond); text-transform: uppercase; letter-spacing: .05em; }
.out-head .meta { font-size: 12px; color: var(--code-muted); font-variant-numeric: tabular-nums; }
.out-act { display: flex; align-items: center; gap: 10px; }
.cstatus { font-size: 12px; color: var(--code-muted); }
.out-panel pre { margin: 0; padding: 14px; flex: 1; min-height: 240px; max-height: 68vh; overflow: auto; font: 12.5px/1.6 var(--f-mono); white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 2; }
@media (min-width: 1120px) { .out-panel pre { max-height: none; } }
.otabs { display: flex; flex-wrap: wrap; gap: 2px; padding: 8px 10px 0; background: rgba(255,255,255,.04); }
.otab { font: 700 12px/1 var(--f-cond); letter-spacing: .05em; text-transform: uppercase; padding: 10px 14px; color: var(--code-muted); background: transparent; border: 0; border-bottom: 2px solid transparent; cursor: pointer; }
.otab[aria-selected="true"] { color: var(--code-fg); border-bottom-color: var(--btn); }
.otools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-left: auto; padding-bottom: 6px; }
.zb { min-width: 30px; height: 28px; padding: 0 8px; font: 700 12px var(--f-cond); letter-spacing: .04em; text-transform: uppercase; color: var(--code-fg); background: transparent; border: 1px solid rgba(255,255,255,.22); border-radius: 2px; cursor: pointer; }
.zb:hover { background: rgba(255,255,255,.1); }
.psw { position: relative; display: inline-grid; grid-template-columns: 1fr 1fr; align-items: center; height: 28px; margin-right: 4px; border: 1px solid rgba(255,255,255,.22); border-radius: 14px; background: rgba(255,255,255,.05); }
.psw-thumb { position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc(50% - 2px); border-radius: 12px; background: var(--btn); transition: transform .16s ease; }
.psw[data-v="letter"] .psw-thumb { transform: translateX(100%); }
.psw-b { position: relative; z-index: 1; min-width: 46px; height: 100%; padding: 0 10px; font: 700 12px var(--f-cond); letter-spacing: .04em; text-transform: uppercase; color: var(--code-muted); background: transparent; border: 0; border-radius: 14px; cursor: pointer; }
.psw-b[aria-checked="true"] { color: var(--btn-fg); }
.zl { font-size: 12px; color: var(--code-muted); min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; }
.pv { flex: 1; min-height: 360px; max-height: 78vh; overflow: auto; background: #2C3C52; padding: 12px; }
@media (min-width: 1120px) { .pv { max-height: none; } }
.out-panel.full { position: fixed; inset: 0; z-index: 60; max-height: none; border-radius: 0; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.out-panel.full .pv, .out-panel.full pre { max-height: none; }
@media (min-width: 1400px) { .editor { grid-template-columns: minmax(0, 1fr) 500px; } }
@media (min-width: 1800px) { .editor { grid-template-columns: minmax(0, 1fr) 640px; } }
.out-panel pre:empty::before { content: attr(data-empty); color: var(--code-muted); }
.out-foot { padding: 12px 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: 13px; color: var(--code-muted); }
.out-foot a { color: var(--code-fg); }

/* Meine Kreationen */
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.fchip { font: 700 12px/1 var(--f-cond); text-transform: uppercase; letter-spacing: .03em; padding: 10px 12px; text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: 2px; }
.fchip.on { background: var(--bar); color: #fff; border-color: var(--bar); }
.rows { display: flex; flex-direction: column; gap: 8px; }
.row { --acc: #555; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--acc); padding: 10px 12px; }
.row input[type=checkbox] { width: 20px; height: 20px; margin: 0; accent-color: var(--btn); flex: 0 0 auto; }
.rmain { flex: 1 1 220px; min-width: 0; }
.rname { font: 700 16px/1.2 var(--f-cond); overflow-wrap: anywhere; }
.rmeta { font-size: 13px; color: var(--muted); }
.badge { font: 700 11px/1 var(--f-cond); text-transform: uppercase; letter-spacing: .05em; padding: 5px 7px; color: #fff; background: var(--acc); border-radius: 2px; flex: 0 0 auto; }
.ract { display: flex; flex-wrap: wrap; gap: 6px; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 12px; }
.tools label { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
.tools input { accent-color: var(--btn); }
.empty { border: 1px dashed var(--field-line); padding: 36px 16px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 14px; }
.note { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--danger); padding: 10px 12px; margin-bottom: 14px; font-size: 14px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

    }
    function refreshStatus() {
      const miss = T.fields.filter(f => f.req && f.k && (!f.enable || f.enable(d)) && isEmpty(d[f.k])).map(f => f.l);
      if (!S(d.name) && !cur.id) { status.textContent = 'Enter a name and your work is saved automatically.'; status.className = 'status'; return; }
      status.className = 'status' + (storeOK ? ' ok' : '');
      status.textContent = storeOK ? 'Saved on this device' + (miss.length ? ' · Still required: ' + miss.join(', ') : '') : 'Not saved: this browser blocks storage. Copy your code before you leave.';
    }
    function changed(f) {
      if (f && f.k === 'cls') {
        const prev = S(d.term);
        if (!prev || Object.values(SUBTERM).includes(prev)) { d.term = SUBTERM[d.cls] || ''; if (ctx.refs.term) ctx.refs.term.value = d.term; }
      }
      applyEnable(); refreshOut(); persist(); refreshStatus();
    }

    const grid = h('div', { class: 'fgrid' });
    T.fields.forEach(f => {
      if (f.t === 'section') grid.append(h('div', { class: 'sec' }, h('h2', { text: f.l }), f.help ? h('p', { class: 'sec-help', text: f.help }) : null));
      else grid.append(buildField(f, d, ctx));
    });

    const del = h('button', { class: 'btn line', type: 'button', text: 'Delete creation' });
    del.addEventListener('click', () => arm(del, 'Really delete?', () => { store = store.filter(r => r.id !== cur.id); writeStore(); cur = null; location.hash = '#creations'; }));
    const foot = h('div', { class: 'edfoot' }, status, h('a', { class: 'btn line', href: '#creations', text: 'My creations' }), h('button', { class: 'btn', type: 'button', text: 'Copy code', onclick: () => copyText(out.pre.textContent, copyStatus) }));
    const copyStatus = h('span', { class: 'cstatus' }); copyStatus._pre = out.pre;
    foot.append(copyStatus);
    if (cur.id) foot.append(del);

    const top = h('div', { class: 'top' },
      crumbs([['Home', '#home'], ['Creations', '#creations'], [(rec ? 'Edit ' : 'Create a ') + T.name]]),
      h('div', { class: 'topbtns' }, h('a', { class: 'btn dark', href: '#creations-' + type, text: 'View my ' + T.plural.toLowerCase() }), h('a', { class: 'btn dark', href: '#new-' + type, text: 'Create ' + (/^[aeiou]/i.test(T.name) ? 'an ' : 'a ') + T.name.toLowerCase() })));

    shell('home', top,
      h('div', { class: 'editor', style: '--acc:' + T.color },
        h('div', { class: 'form' }, h('h1', { class: 'ptitle', text: (rec ? 'Edit ' : 'Create a ') + T.name }), grid, foot),
        out.el));
    applyEnable(); refreshOut(); refreshStatus();
    const first = app.querySelector('.fgrid input[type=text]'); if (first && !rec) first.focus({ preventScroll: true });
  }

  /* ---------- Meine Kreationen ---------- */
  const selected = new Set();
  let pageBreak = false;
  function addExamples() {
    const mk = (type, p) => ({ id: newId(), type, d: Object.assign(defaults(TYPES[type]), p), updated: Date.now() });
    store.push(
      mk('spell', { name: 'Ember Dart', version: '1', level: '0', school: 'Evocation', ctNum: '1', ctUnit: 'action', comp: ['V', 'S'], rangeType: 'ranged', rangeDist: '60', durType: 'instant', classes: ['Sorcerer', 'Wizard'], desc: 'You hurl a mote of fire at a creature or object within range. Make a ranged spell attack against the target. On a hit, the target takes 1d10 fire damage. A flammable object hit by this spell ignites if it is not being worn or carried.\n\nThis spell’s damage increases by 1d10 when you reach 5th level (2d10), 11th level (3d10), and 17th level (4d10).' }),
      mk('item', { name: 'Lantern of Last Light', version: '1', itype: 'Wondrous Item', rarity: 'Uncommon', attune: false, desc: 'While lit, this brass lantern sheds bright light in a 30-foot radius and dim light for an additional 30 feet.\n\n***Last Light.*** Once per dawn, when you or a creature within 30 feet of you is reduced to 0 hit points, you can use your reaction to flare the lantern. That creature drops to 1 hit point instead.' }),
      mk('monster', { name: 'Shadow Wolf', version: '1', size: 'Medium', mtype: 'monstrosity', align: 'chaotic evil', cr: '2', ac: '13', acType: 'natural armor', hp: '37', hpf: '5d8 + 15', walk: '50', str: '17', dex: '15', con: '16', int: '3', wis: '12', cha: '7', skills: 'Perception +3, Stealth +4', senses: 'darkvision 60 ft., passive Perception 13', traits: 'Pack Tactics. The wolf has advantage on an attack roll against a creature if at least one of the wolf’s allies is within 5 feet of the creature and the ally isn’t incapacitated.', actions: 'Bite. *Melee Weapon Attack:* +5 to hit, reach 5 ft., one target. *Hit:* 11 (2d6 + 4) piercing damage. If the target is a creature, it must succeed on a DC 13 Strength saving throw or be knocked prone.' })
    );
    writeStore();
  }

  function creations(filter) {
    if (filter !== 'all' && !TYPES[filter]) filter = 'all';
    const list = store.filter(r => filter === 'all' || r.type === filter);
    const out = outPanel('Your book', 'Tick the creations you want in one book. The pages appear here.');
    const refreshOut = () => {
      const picked = store.filter(r => selected.has(r.id));
      const text = picked.map(r => TYPES[r.type].gen(Object.assign(defaults(TYPES[r.type]), r.d))).join(pageBreak ? '\n\n\\page\n\n' : '\n\n');
      out.set(text, picked.length + (picked.length === 1 ? ' creation' : ' creations') + ' · ' + (text ? text.split('\n').length : 0) + ' lines', 'homebrew-book');
    };
    const counts = k => k === 'all' ? store.length : store.filter(r => r.type === k).length;
    const filters = h('div', { class: 'filters' }, ['all'].concat(ORDER).map(k => h('a', { class: 'fchip' + (k === filter ? ' on' : ''), href: k === 'all' ? '#creations' : '#creations-' + k, text: (k === 'all' ? 'All' : TYPES[k].plural) + ' (' + counts(k) + ')' })));

    const rows = h('div', { class: 'rows' }, list.map(r => {
      const T = TYPES[r.type];
      const d = Object.assign(defaults(T), r.d);
      const cb = h('input', { type: 'checkbox', 'aria-label': 'Include ' + (S(d.name) || 'creation') + ' in the combined code', checked: selected.has(r.id), onchange: e => { if (e.target.checked) selected.add(r.id); else selected.delete(r.id); refreshOut(); } });
      cb.checked = selected.has(r.id);
      const delBtn = h('button', { class: 'btn line sm', type: 'button', text: 'Delete' });
      delBtn.addEventListener('click', () => arm(delBtn, 'Sure?', () => { store = store.filter(x => x.id !== r.id); selected.delete(r.id); writeStore(); route(); }));
      return h('div', { class: 'row', style: '--acc:' + T.color },
        cb, h('span', { class: 'badge', text: T.name }),
        h('div', { class: 'rmain' }, h('div', { class: 'rname', text: (S(d.name) || 'Unnamed') + (S(d.version) ? ' (v' + S(d.version) + ')' : '') }),
          h('div', { class: 'rmeta', text: T.meta(d) + ' · ' + new Date(r.updated).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) })),
        h('div', { class: 'ract' },
          h('a', { class: 'btn sm', href: '#edit-' + r.id, text: 'Edit' }),
          h('button', { class: 'btn line sm', type: 'button', text: 'Duplicate', onclick: () => {
            const c = { id: newId(), type: r.type, d: Object.assign(clone(r.d), { name: S(r.d.name) + ' (copy)' }), updated: Date.now() };
            store.splice(store.indexOf(r) + 1, 0, c); writeStore(); route();
          } }), delBtn));
    }));

    let body;
    if (!store.length) {
      body = h('div', { class: 'empty' }, h('div', { text: 'You have not saved any creations yet.' }),
        h('div', { class: 'cbtns' }, h('a', { class: 'btn', href: '#home', text: 'Create something' }), h('button', { class: 'btn line', type: 'button', text: 'Add 3 example creations', onclick: () => { addExamples(); route(); } })));
    } else if (!list.length) {
      body = h('div', { class: 'empty' }, h('div', { text: 'Nothing here yet.' }), h('a', { class: 'btn', href: '#new-' + filter, text: 'Create ' + TYPES[filter].name.toLowerCase() }));
    } else body = rows;

    const pbCb = h('input', { type: 'checkbox', id: 'pb', onchange: e => { pageBreak = e.target.checked; refreshOut(); } });
    pbCb.checked = pageBreak;
    const tools = h('div', { class: 'tools' },
      h('button', { class: 'btn line sm', type: 'button', text: 'Select all shown', onclick: () => { list.forEach(r => selected.add(r.id)); route(); } }),
      h('button', { class: 'btn line sm', type: 'button', text: 'Select none', onclick: () => { selected.clear(); route(); } }),
      h('label', { for: 'pb' }, pbCb, 'Page break between creations'));

    shell('creations',
      h('div', { class: 'top' }, crumbs([['Home', '#home'], ['Creations']]), h('div', { class: 'topbtns' }, h('a', { class: 'btn dark', href: '#home', text: 'Create new' }))),
      h('h1', { class: 'ptitle', text: 'My Creations' }),
      storeOK ? null : h('div', { class: 'note', text: 'This browser blocks storage, so creations are kept only until you close this page. Copy your code before you leave.' }),
      h('div', { class: 'editor' }, h('div', { style: 'min-width:0' }, filters, store.length ? tools : null, body), out.el));
    refreshOut();
  }

  /* ---------- Routing ---------- */
  function route() {
    const hs = (location.hash || '#home').slice(1) || 'home';
    let m;
    if (hs === 'new-subclass') subclassPicker();
    else if ((m = hs.match(/^new-subclass-([a-z]+)$/))) {
      const cls = CLASSES.find(c => lower(c) === m[1]) || '';
      const init = pendingTemplate || { cls, term: SUBTERM[cls] || '' };
      pendingTemplate = null;
      editor('subclass', null, init);
    }
    else if ((m = hs.match(/^new-([a-z]+)$/)) && TYPES[m[1]]) editor(m[1], null, null);
    else if ((m = hs.match(/^edit-([a-z0-9]+)$/))) {
      const rec = store.find(r => r.id === m[1]);
      if (rec) editor(rec.type, rec, null); else { location.hash = '#creations'; }
    }
    else if (hs === 'assets') assetsPage();
    else if (hs === 'creations') creations('all');
    else if ((m = hs.match(/^creations-([a-z]+)$/))) creations(m[1]);
    else home();
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
